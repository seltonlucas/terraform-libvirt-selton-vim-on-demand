name: ODIM VIM provisioning
run-name: ODIM-VIM-${{ inputs.experiment_id || github.event.client_payload.experiment_id || github.run_id }}
on:
  workflow_dispatch:
    inputs:
      terraform_variables:
        required: true
        type: string
      target_cluster_ip:
        required: false
        type: string
      cluster_name:
        required: false
        type: string
      config_base64:
        required: false
        type: string
      dispatch_free5gc:
        required: false
        type: boolean
        default: false
      free5gc_ref:
        required: false
        type: string
        default: metrics
      experiment_id:
        required: false
        type: string
      minimum_ready_nodes:
        required: false
        type: number
        default: 1
      readiness_timeout_s:
        required: false
        type: number
        default: 900
      cluster_user:
        required: false
        type: string
        default: packer
  repository_dispatch:
    types: [ondemand]
permissions:
  contents: read

jobs:
  ondemand-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      # ============================================
      # INÍCIO - Capturar timestamp inicial
      # ============================================
      - name: 📊 Start Timer
        id: start-timer
        run: |
          echo "start_time=$(date +%s)" >> $GITHUB_OUTPUT
          echo "🕐 Workflow started at: $(date '+%Y-%m-%d %H:%M:%S')"
      
      # ============================================
      # SETUP STEPS
      # ============================================
      - name: ⏱️ Checkout
        id: checkout
        uses: actions/checkout@v4
      
      - name: Validate and normalize event
        run: python3 -m scripts.odim_ci --context "$RUNNER_TEMP/odim-context.json" context p1

      - name: 📊 Checkpoint - Checkout
        run: |
          echo "checkout_end=$(date +%s)" >> $GITHUB_ENV
          START_TIME=${{ steps.start-timer.outputs.start_time }}
          NOW=$(date +%s)
          ELAPSED=$((NOW - START_TIME))
          echo "✓ Checkout completed in ${ELAPSED}s"
      
      - name: ⏱️ Setup Terraform
        id: setup-tf
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      
      - name: 📊 Checkpoint - Setup Terraform
        run: |
          START_TIME=${{ steps.start-timer.outputs.start_time }}
          NOW=$(date +%s)
          ELAPSED=$((NOW - START_TIME))
          echo "✓ Terraform setup completed in ${ELAPSED}s"
      
      - name: ⏱️ Install genisoimage
        run: |
          START=$(date +%s)
          sudo apt-get update
          sudo apt-get install -y genisoimage sshpass
          END=$(date +%s)
          echo "⏱️  genisoimage install: $((END - START))s"
      
      - name: ⏱️ Configure SSH
        run: |
          START=$(date +%s)
          mkdir -p ~/.ssh/
          echo "$SSH_KEY" > ~/.ssh/proxy.key
          chmod 600 ~/.ssh/proxy.key
          echo "$QEMU_KEY" > ~/.ssh/qemu.key
          chmod 600 ~/.ssh/qemu.key
          echo "$GIT_KEY" > ~/.ssh/git.key
          chmod 600 ~/.ssh/git.key
          cat >>~/.ssh/config <<END
          Host proxy
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/proxy.key
            StrictHostKeyChecking no
            Port $SSH_PORT
          Host qemu
            HostName $QEMU_HOST
            IdentityFile ~/.ssh/qemu.key
            StrictHostKeyChecking no
            ProxyJump proxy
          END
          if [ -n "$CLUSTER_SSH_KEY" ]; then
            printf "%s\n" "$CLUSTER_SSH_KEY" > ~/.ssh/cluster.key
            chmod 600 ~/.ssh/cluster.key
            echo "ODIM_SSH_IDENTITY=$HOME/.ssh/cluster.key" >> "$GITHUB_ENV"
          fi
          END=$(date +%s)
          echo "⏱️  SSH config: $((END - START))s"
        env:
          SSH_USER: ${{ secrets.PROXY_USERNAME }}
          SSH_KEY: ${{ secrets.SSH_PROXY_KEY }}
          SSH_HOST: ${{ secrets.PROXY_HOST }}
          SSH_PORT: ${{ secrets.PROXY_PORT }}
          QEMU_USER: ${{ secrets.USERNAME }}
          QEMU_HOST: ${{ secrets.HOST }}
          QEMU_KEY: ${{ secrets.KEY }}
          QEMU_PORT: ${{ secrets.HOST }}
          GIT_KEY: ${{ secrets.GIT_KEY }}
          CLUSTER_SSH_KEY: ${{ secrets.CLUSTER_SSH_KEY }}
      
      # ============================================
      # TERRAFORM WORKFLOW (Core da medição)
      # ============================================
      - name: Check handoff credentials before provisioning
        env:
          CLUSTER_PASSWORD: ${{ secrets.CLUSTER_PASSWORD }}
          ODIM_DISPATCH_TOKEN: ${{ secrets.FREE5GC_DISPATCH_TOKEN }}
        run: |
          if [[ -z "${ODIM_SSH_IDENTITY:-}" && -z "$CLUSTER_PASSWORD" ]]; then
            echo "Cluster authentication is required before provisioning"
            exit 1
          fi
          if [[ "$ODIM_DISPATCH_FREE5GC" == "true" && -z "$ODIM_DISPATCH_TOKEN" ]]; then
            echo "A dedicated FREE5GC_DISPATCH_TOKEN is required for automatic dispatch"
            exit 1
          fi

      - name: ⏱️ Terraform Init
        id: init
        run: |
          START=$(date +%s)
          terraform init
          END=$(date +%s)
          echo "init_duration=$((END - START))" >> $GITHUB_OUTPUT
          echo "⏱️  Terraform Init: $((END - START))s"
        env:
          GIT_SSH_COMMAND: "echo '${{ secrets.GIT_KEY }}' > id_rsa
          && ssh-keyscan github.com > known_hosts
          && chmod 600 id_rsa known_hosts
          && ssh -i ./id_rsa -o UserKnownHostsFile=./known_hosts"
        
      - name: ⏱️ Terraform Plan
        id: plan
        run: |
          START=$(date +%s)
          python3 -m scripts.odim_ci --context "$RUNNER_TEMP/odim-context.json" plan
          END=$(date +%s)
          echo "plan_duration=$((END - START))" >> $GITHUB_OUTPUT
          echo "⏱️  Terraform Plan: $((END - START))s"
      
      - name: ⏱️ Terraform Apply
        id: apply
        if: steps.plan.outcome == 'success'
        run: |
          START=$(date +%s)
          terraform apply -auto-approve tfplan
          END=$(date +%s)
          echo "apply_duration=$((END - START))" >> $GITHUB_OUTPUT
          echo "⏱️  Terraform Apply: $((END - START))s"
      
      - name: Terraform Destroy on Apply Failure
        if: failure() && steps.apply.outcome == 'failure'
        run: terraform destroy -auto-approve
      
      - name: Copy state
        run: scp terraform.tfstate $QEMU_USER@qemu:/home/$QEMU_USER
        env:
          QEMU_USER: ${{ secrets.USERNAME }}
          QEMU_HOST: ${{ secrets.HOST }}
      
      - name: Get IP addresses from Terraform
        id: tf-output
        run: |
          terraform output -json k8s > k8s.json
          echo "🔍 Terraform Output:"
          cat k8s.json
          IPS=$(jq -r 'to_entries | map(.value.domain[]?.address) | join(" ")' k8s.json)
          echo "ip_list=${IPS}" >> $GITHUB_OUTPUT
      
      # ============================================
      # RESUMO FINAL
      # ============================================
      - name: Wait for target Kubernetes readiness
        id: cluster-ready
        env:
          SSHPASS: ${{ secrets.CLUSTER_PASSWORD }}
        run: >-
          python3 -m scripts.odim_ci --context "$RUNNER_TEMP/odim-context.json"
          gate --terraform-output k8s.json --report metrics/vim-readiness.json

      - name: Record disabled Free5GC handoff
        if: success() && env.ODIM_DISPATCH_FREE5GC != 'true'
        run: >-
          python3 -m scripts.odim_ci --context "$RUNNER_TEMP/odim-context.json"
          dispatch --readiness-report metrics/vim-readiness.json --report metrics/dispatch.json

      - name: Dispatch Free5GC after readiness
        if: success() && steps.cluster-ready.outputs.ready == 'true' && env.ODIM_DISPATCH_FREE5GC == 'true'
        env:
          ODIM_DISPATCH_TOKEN: ${{ secrets.FREE5GC_DISPATCH_TOKEN }}
        run: >-
          python3 -m scripts.odim_ci --context "$RUNNER_TEMP/odim-context.json"
          dispatch --readiness-report metrics/vim-readiness.json --report metrics/dispatch.json

      - name: Upload readiness and handoff evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: metrics/*.json
          if-no-files-found: warn

      - name: 📊 Performance Summary
        if: always()
        run: |
          START_TIME=${{ steps.start-timer.outputs.start_time }}
          END_TIME=$(date +%s)
          TOTAL_DURATION=$((END_TIME - START_TIME))
          
          echo "========================================"
          echo "   PIPELINE PERFORMANCE REPORT"
          echo "========================================"
          echo ""
          echo "Terraform Init:  ${{ steps.init.outputs.init_duration }}s"
          echo "Terraform Plan:  ${{ steps.plan.outputs.plan_duration }}s"
          echo "Terraform Apply: ${{ steps.apply.outputs.apply_duration }}s"
          echo ""
          echo "TOTAL PIPELINE:  ${TOTAL_DURATION}s (~$((TOTAL_DURATION / 60))m)"
          echo "========================================"
          
          # Salvar em artifact
          cat > performance_report.txt <<EOF
          Pipeline Performance Report
          Execution Date: $(date '+%Y-%m-%d %H:%M:%S')
          
          Timings:
          - Terraform Init:  ${{ steps.init.outputs.init_duration }}s
          - Terraform Plan:  ${{ steps.plan.outputs.plan_duration }}s
          - Terraform Apply: ${{ steps.apply.outputs.apply_duration }}s
          
          Total: ${TOTAL_DURATION}s
          EOF
      
      - name: Upload Performance Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: performance_report.txt

